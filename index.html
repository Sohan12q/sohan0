<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>𓆩💚 𝐁𝐋𝐀𝐂𝐊𝐄𝐘 𝐁𝐎𝐒𝐒 💚𓆪</title>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;700&family=Rajdhani:wght@600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
:root { --gold:#b8860b; --win:#ff69b4; --loss:#d9534f; --jackpot:#8b00ff; }
* { box-sizing:border-box; margin:0; padding:0; }
@keyframes bgPulse { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
@keyframes particleFloat { 0%{transform:translateY(100vh) scale(0);opacity:0;} 10%{opacity:1;} 90%{opacity:1;} 100%{transform:translateY(-100px) scale(1);opacity:0;} }
@keyframes glowRing { 0%,100%{box-shadow:0 0 20px #00ff88,0 0 40px #8b00ff;} 50%{box-shadow:0 0 40px #8b00ff,0 0 80px #00ff88;} }
@keyframes discoGlow { 0%{border-color:#ff0000;box-shadow:0 0 15px #ff0000;} 25%{border-color:#ff69b4;box-shadow:0 0 15px #ff69b4;} 50%{border-color:#8b00ff;box-shadow:0 0 15px #8b00ff;} 75%{border-color:#00ffff;box-shadow:0 0 15px #00ffff;} 100%{border-color:#ff0000;box-shadow:0 0 15px #ff0000;} }
@keyframes shimmer { 0%,100%{opacity:0.3;} 50%{opacity:0.7;} }
@keyframes discoName {
  0%{color:#ff0000;text-shadow:0 0 10px #ff0000,0 0 25px #ff0000;} 14%{color:#ff7700;text-shadow:0 0 10px #ff7700,0 0 25px #ff7700;}
  28%{color:#ffff00;text-shadow:0 0 10px #ffff00,0 0 25px #ffff00;} 42%{color:#00ff00;text-shadow:0 0 10px #00ff00,0 0 25px #00ff00;}
  56%{color:#00ffff;text-shadow:0 0 10px #00ffff,0 0 25px #00ffff;} 70%{color:#8b00ff;text-shadow:0 0 10px #8b00ff,0 0 25px #8b00ff;}
  85%{color:#ff00ff;text-shadow:0 0 10px #ff00ff,0 0 25px #ff00ff;} 100%{color:#ff0000;text-shadow:0 0 10px #ff0000,0 0 25px #ff0000;}
}
@keyframes jackpotPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }
body {
  font-family:'El Messiri',sans-serif;
  background:linear-gradient(135deg,#0a0a1a 0%,#0d1f0d 25%,#1a0033 50%,#0d1f0d 75%,#0a0a1a 100%);
  background-size:400% 400%; animation:bgPulse 8s ease infinite;
  color:#333; min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:15px; position:relative; overflow-x:hidden;
}
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(ellipse at 20% 50%,rgba(0,255,100,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(139,0,255,0.12) 0%,transparent 60%),radial-gradient(ellipse at 60% 80%,rgba(0,200,80,0.07) 0%,transparent 50%);
  animation:shimmer 4s ease-in-out infinite;
}
.particle { position:fixed; border-radius:50%; pointer-events:none; z-index:0; animation:particleFloat linear infinite; }
#loginOverlay { position:fixed; inset:0; background:rgba(10,5,30,0.96); z-index:9999; display:flex; justify-content:center; align-items:center; backdrop-filter:blur(10px); }
.login-box { background:linear-gradient(145deg,#0f0f2a,#0a1a0a); padding:40px 30px; border-radius:30px; border:2px solid var(--gold); text-align:center; width:90%; max-width:380px; box-shadow:0 0 40px rgba(0,255,100,0.15),0 0 80px rgba(139,0,255,0.15); animation:glowRing 3s ease-in-out infinite; }
.login-box h2 { font-family:'Orbitron',sans-serif; margin-bottom:20px; animation:discoName 1.5s linear infinite; }
.login-box input { width:100%; padding:15px; margin-bottom:20px; background:rgba(255,255,255,0.07); border:1px solid rgba(0,255,100,0.3); color:#fff; border-radius:12px; outline:none; text-align:center; font-size:1.1rem; }
.login-box input::placeholder { color:rgba(255,255,255,0.4); }
.login-box button { width:100%; padding:15px; background:linear-gradient(45deg,#b8860b,#ffd700); border:none; color:#fff; font-weight:900; border-radius:12px; cursor:pointer; text-transform:uppercase; font-family:'Rajdhani',sans-serif; }
.main-container { width:100%; max-width:450px; background:#ffffff; border-radius:30px; padding:20px; border:3px solid #e0e0e0; animation:discoGlow 3s linear infinite; margin-top:20px; position:relative; z-index:1; }
.header { font-family:'Orbitron',sans-serif; font-size:1.4rem; text-align:center; margin-bottom:15px; font-weight:900; padding:10px; border-radius:12px; animation:discoName 1.5s linear infinite; }
.trend-timer { text-align:center; font-family:'Rajdhani',sans-serif; font-weight:900; color:#ff4444; font-size:1.2rem; margin-bottom:15px; letter-spacing:1px; }
.live-history-title { font-size:0.75rem; color:#00aa55; text-transform:uppercase; letter-spacing:2px; margin-bottom:10px; font-weight:900; }
.results-container { display:flex; gap:10px; overflow-x:auto; padding-bottom:15px; margin-bottom:15px; scrollbar-width:none; }
.res-circle { width:45px; height:45px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; font-weight:900; background:rgba(0,0,0,0.06); border:2px solid rgba(0,180,80,0.4); color:#111; }
.predict-card { background:rgba(0,0,0,0.03); border-radius:20px; padding:20px; margin-bottom:20px; border:1px solid rgba(139,0,255,0.3); }
.info-row { font-size:0.9rem; margin-bottom:10px; color:#333; font-weight:700; display:flex; justify-content:space-between; flex-wrap:wrap; gap:5px; }
.prediction-display { text-align:center; padding:15px; border-radius:15px; background:rgba(0,0,0,0.04); border:2px solid var(--gold); }
.pred-res { font-family:'Orbitron',sans-serif; font-size:2.2rem; font-weight:900; color:#00aa55; }
.pred-num { color:#8b00ff; margin-top:5px; font-size:1.5rem; font-weight:900; letter-spacing:5px; }
.open-history-btn { width:100%; padding:13px; background:linear-gradient(45deg,#0d1f0d,#1a0033); border:2px solid rgba(0,255,100,0.4); color:#00ff88; font-weight:900; border-radius:12px; cursor:pointer; text-transform:uppercase; font-family:'Rajdhani',sans-serif; font-size:1rem; letter-spacing:2px; }
.history-section { position:fixed; inset:0; z-index:8000; display:none; flex-direction:column; background:#f5f5f5; }
.history-section.active { display:flex; }
.history-topbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; padding:15px 20px; background:linear-gradient(135deg,#0a0a1a,#1a0033); border-bottom:2px solid rgba(0,255,100,0.3); position:sticky; top:0; z-index:10; }
.history-topbar-title { font-family:'Orbitron',sans-serif; font-size:1rem; font-weight:900; letter-spacing:2px; animation:discoName 1.5s linear infinite; }
.history-count-badge { background:rgba(0,255,136,0.15); border:1px solid rgba(0,255,136,0.4); color:#00ff88; padding:4px 12px; border-radius:20px; font-size:0.75rem; font-family:'Rajdhani',sans-serif; font-weight:700; }
.close-history-btn { background:linear-gradient(45deg,#8b00ff,#00ff88); border:none; color:#fff; font-weight:900; font-family:'Rajdhani',sans-serif; font-size:0.9rem; padding:8px 18px; border-radius:10px; cursor:pointer; }
.stats-bar { display:flex; gap:10px; padding:12px 15px; background:linear-gradient(135deg,#0a0a1a,#1a0033); border-bottom:1px solid rgba(255,255,255,0.1); justify-content:space-around; flex-wrap:wrap; }
.stat-item { text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; }
.stat-label { font-size:0.65rem; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:1px; }
.stat-value { font-size:1rem; }
.stat-win { color:#ff69b4; } .stat-loss { color:#ff4444; } .stat-jackpot { color:#bf5fff; } .stat-pending { color:#aaa; } .stat-total { color:#fff; }
.history-scroll-area { flex:1; overflow-y:auto; padding:15px; background:#f5f5f5; }
.history-card-full { background:#fff; border-radius:15px; overflow:hidden; border:1px solid rgba(0,0,0,0.08); width:100%; box-shadow:0 2px 15px rgba(0,0,0,0.08); }
table { width:100%; border-collapse:collapse; }
th { background:rgba(0,0,0,0.05); color:#333; padding:14px; font-size:0.8rem; letter-spacing:1px; border-bottom:2px solid rgba(0,0,0,0.08); }
td { padding:12px; text-align:center; border-bottom:1px solid rgba(0,0,0,0.04); font-size:0.9rem; color:#222; }
tr.row-jackpot { animation:jackpotPulse 1.5s ease-in-out infinite; background:rgba(139,0,255,0.05); }
tr.row-win { background:rgba(255,105,180,0.05); }
tr.row-loss { background:rgba(217,83,79,0.04); }
.status-badge { padding:5px 10px; border-radius:5px; font-weight:900; font-size:0.75rem; color:#fff; }
.win-bg { background:var(--win); } .loss-bg { background:var(--loss); } .jackpot-bg { background:var(--jackpot); border:1px solid #fff; box-shadow:0 0 8px rgba(139,0,255,0.7); } .pending-bg { background:rgba(100,100,100,0.15); color:#666; }
.serial-td { color:#999; font-size:0.75rem; font-weight:700; }
.sound-popup { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-120px); z-index:99999; padding:12px 28px; border-radius:30px; font-family:'Orbitron',sans-serif; font-size:1rem; font-weight:900; letter-spacing:2px; transition:transform 0.4s ease; pointer-events:none; white-space:nowrap; }
.sound-popup.show { transform:translateX(-50%) translateY(0); }
.win-popup { background:#ff69b4; color:#fff; box-shadow:0 0 30px rgba(255,105,180,0.7); }
.loss-popup { background:#d9534f; color:#fff; box-shadow:0 0 30px rgba(217,83,79,0.7); }
.jackpot-popup { background:linear-gradient(45deg,#8b00ff,#ff00ff); color:#fff; box-shadow:0 0 40px rgba(139,0,255,0.9); }
#loadNotice { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#0f0; padding:6px 14px; border-radius:20px; font-size:0.7rem; font-family:'Rajdhani',sans-serif; z-index:500; display:none; }
</style>
</head>
<body>
<div class="sound-popup" id="soundPopup"></div>
<div id="loadNotice">Loading...</div>
<div id="loginOverlay">
  <div class="login-box">
    <h2><i class="fas fa-crown"></i> 𓆩💚 𝐁𝐋𝐀𝐂𝐊𝐄𝐘 𝐁𝐎𝐒𝐒 💚𓆪</h2>
    <input type="text" id="accessKey" placeholder="KEY..." />
    <button onclick="checkAuth()">Unlock Predictor</button>
  </div>
</div>
<div class="history-section" id="historySection">
  <div class="history-topbar">
    <div class="history-topbar-title">📊 RESULT HISTORY</div>
    <div class="history-count-badge" id="historyCountBadge">0 RECORDS</div>
    <button class="close-history-btn" onclick="closeHistory()">✕ CLOSE</button>
  </div>
  <div class="stats-bar">
    <div class="stat-item"><div class="stat-label">WIN</div><div class="stat-value stat-win" id="statWin">0</div></div>
    <div class="stat-item"><div class="stat-label">LOSS</div><div class="stat-value stat-loss" id="statLoss">0</div></div>
    <div class="stat-item"><div class="stat-label">JACKPOT</div><div class="stat-value stat-jackpot" id="statJackpot">0</div></div>
    <div class="stat-item"><div class="stat-label">PENDING</div><div class="stat-value stat-pending" id="statPending">0</div></div>
    <div class="stat-item"><div class="stat-label">TOTAL</div><div class="stat-value stat-total" id="statTotal">0</div></div>
  </div>
  <div class="history-scroll-area">
    <div class="history-card-full">
      <table>
        <thead><tr><th>#</th><th>PERIOD</th><th>B/S</th><th>2-NUMS</th><th>RESULT</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>
</div>
<div class="main-wrapper" id="mainWrapper" style="display:none;width:100%;max-width:450px;">
  <div class="main-container">
    <div class="header">𓆩💚 𝐁𝐋𝐀𝐂𝐊𝐄𝐘 𝐁𝐎𝐒𝐒 💚𓆪</div>
    <div class="trend-timer" id="trendTime">GAME TIME: --:--:--</div>
    <div class="live-history-title">Game History</div>
    <div class="results-container" id="liveResults"></div>
    <div class="predict-card">
      <div class="info-row"><span>PERIOD:- <span id="period1M">---</span></span><span>UNDER 2 LEVEL BOOM 🤯</span></div>
      <div class="prediction-display">
        <div id="res1M" class="pred-res">WAITING</div>
        <div id="num1M" class="pred-num">--</div>
      </div>
    </div>
    <button class="open-history-btn" onclick="openHistory()">📊 VIEW RESULT HISTORY (<span id="historyCountBtn">0</span>)</button>
  </div>
</div>
<script>
(function(){ const colors=['#00ff88','#8b00ff','#00cc66','#bf5fff','#00ffaa','#7700cc']; for(let i=0;i<18;i++){ const p=document.createElement('div'); p.className='particle'; p.style.cssText=`left:${Math.random()*100}%;width:${Math.random()*6+3}px;height:${Math.random()*6+3}px;background:${colors[Math.floor(Math.random()*colors.length)]};box-shadow:0 0 8px ${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*12+8}s;animation-delay:${Math.random()*10}s;opacity:0;`; document.body.appendChild(p); } })();
let audioCtx=null;
function getCtx(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function tone(ctx,type,freq,start,dur,vol){ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(vol,ctx.currentTime+start); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+dur); o.start(ctx.currentTime+start); o.stop(ctx.currentTime+start+dur+0.05); }
function playWinSound(){ try{ const c=getCtx(); [523,659,784,1047].forEach((f,i)=>tone(c,'sine',f,i*0.12,0.4,0.25)); }catch(e){} }
function playLossSound(){ try{ const c=getCtx(); [300,250,200].forEach((f,i)=>tone(c,'sawtooth',f,i*0.18,0.35,0.2)); }catch(e){} }
function playJackpotSound(){ try{ const c=getCtx(); [{f:523,t:0},{f:659,t:0.1},{f:784,t:0.2},{f:1047,t:0.3},{f:1319,t:0.4},{f:1047,t:0.55},{f:1319,t:0.65},{f:1568,t:0.75}].forEach(({f,t})=>tone(c,'triangle',f,t,0.18,0.3)); for(let i=0;i<5;i++) tone(c,'sine',1000+Math.random()*1000,0.9+i*0.08,0.15,0.1); }catch(e){} }
function showPopup(type,text){ const el=document.getElementById('soundPopup'); el.className='sound-popup '+type+'-popup'; el.textContent=text; setTimeout(()=>el.classList.add('show'),10); setTimeout(()=>el.classList.remove('show'),2600); }
const SECRET_KEY="BLACKY999";
let myHistory=[], lastPeriod="", notified=new Set();
const API_URL = 'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json';
function checkAuth(){
  if(document.getElementById('accessKey').value===SECRET_KEY){
    document.getElementById('loginOverlay').style.display='none';
    document.getElementById('mainWrapper').style.display='block';
    initApp();
  } else alert("Wrong Key!");
}
function openHistory(){ document.getElementById('historySection').classList.add('active'); }
function closeHistory(){ document.getElementById('historySection').classList.remove('active'); }
function initApp(){ updateData(); setInterval(updateData,3000); startTimer(); }
function startTimer(){ setInterval(()=>{ const s=60-new Date().getSeconds(); document.getElementById('trendTime').textContent=`NEXT UPDATE IN: 00:${s<10?'0'+s:s}`; },1000); }
function predict(list){
  const nums=list.slice(0,10).map(i=>parseInt(i.number));
  const avg=nums.slice(0,5).reduce((a,b)=>a+b,0)/5;
  let size=avg>=4.5?"SMALL":"BIG";
  if(nums[0]>=5&&nums[1]>=5&&nums[2]>=5) size="SMALL";
  if(nums[0]<5&&nums[1]<5&&nums[2]<5) size="BIG";
  let pool=[], last=nums[0];
  if(size==="BIG"){ let b=(last+2)%5; pool=[b,(b+2)%5]; }
  else { let b=5+((last+3)%5); pool=[b,(b+1)>9?5:b+1]; }
  return { size, predNums: pool.sort((a,b)=>a-b) };
}
function updateStats(){
  let w=0,l=0,j=0,p=0;
  myHistory.forEach(h=>{ if(h.status==='WIN✅') w++; else if(h.status==='LOSS') l++; else if(h.status==='JACKPOT') j++; else p++; });
  document.getElementById('statWin').textContent=w;
  document.getElementById('statLoss').textContent=l;
  document.getElementById('statJackpot').textContent=j;
  document.getElementById('statPending').textContent=p;
  document.getElementById('statTotal').textContent=myHistory.length;
  document.getElementById('historyCountBadge').textContent=myHistory.length+' RECORDS';
  document.getElementById('historyCountBtn').textContent=myHistory.length;
}
async function updateData(){
  const notice=document.getElementById('loadNotice');
  try{
    notice.style.display='block';
    notice.textContent='🔄 Loading...';
    notice.style.color='#0f0';
    const r = await fetch(API_URL+'?v='+Date.now());
    const json = await r.json();
    const list = json.data.list;
    notice.textContent='✅ Live data';
    setTimeout(()=>notice.style.display='none',2000);
    document.getElementById('liveResults').innerHTML = list.slice(0,10).map(item=>`
      <div class="res-circle">${item.number}<small style="font-size:0.5rem;color:#00aa55">${String(item.issueNumber).slice(-3)}</small></div>
    `).join('');
    const fullNext=(BigInt(list[0].issueNumber)+1n).toString();
    const disp3=fullNext.slice(-3);
    if(lastPeriod!==fullNext){
      lastPeriod=fullNext;
      const p=predict(list);
      myHistory.unshift({ period:fullNext, periodDisplay:disp3, predict:p.size, numbers:p.predNums, status:"Pending" });
      document.getElementById('period1M').textContent=disp3;
      document.getElementById('res1M').textContent=p.size;
      document.getElementById('num1M').textContent=p.predNums.join(" - ");
    }
    myHistory.forEach(h=>{
      if(h.status==="Pending"){
        const match=list.find(l=>l.issueNumber===h.period);
        if(match){
          const n=parseInt(match.number), sz=n>=5?"BIG":"SMALL";
          if(h.numbers.includes(n)) h.status="JACKPOT";
          else if(h.predict===sz) h.status="WIN✅";
          else h.status="LOSS";
          if(!notified.has(h.period)){
            notified.add(h.period);
            if(h.status==="JACKPOT"){ playJackpotSound(); showPopup('jackpot','🎰 JACKPOT!! 🎰'); }
            else if(h.status==="WIN✅"){ playWinSound(); showPopup('win','✅ WIN!'); }
            else { playLossSound(); showPopup('loss','❌ LOSS'); }
          }
        }
      }
    });
    document.getElementById('historyBody').innerHTML = myHistory.map((h,i)=>{
      const rc=h.status==='JACKPOT'?'row-jackpot':h.status==='WIN✅'?'row-win':h.status==='LOSS'?'row-loss':'';
      const bc=h.status==='WIN✅'?'win-bg':h.status==='LOSS'?'loss-bg':h.status==='JACKPOT'?'jackpot-bg':'pending-bg';
      return `<tr class="${rc}"><td class="serial-td">${i+1}</td><td>${h.periodDisplay}</td><td style="font-weight:bold;color:#00aa55">${h.predict}</td><td style="color:#8b00ff;font-weight:bold">${h.numbers.join(", ")}</td><td><span class="status-badge ${bc}">${h.status}</span></td></tr>`;
    }).join('');
    updateStats();
  } catch(e){
    console.error(e);
    notice.textContent='⚠️ Retrying...';
    notice.style.color='#ff6666';
  }
}
</script>
</body>
</html>
