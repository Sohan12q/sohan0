<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blackey Boss</title>
<style>
body { font-family: Arial; background: #111; color: #0f0; text-align: center; padding: 50px; }
h1 { font-size: 3rem; }
input { padding: 15px; font-size: 1rem; border-radius: 10px; border: none; }
button { padding: 15px 30px; font-size: 1rem; background: #ffd700; border: none; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>
<h1>💚 BLACKEY BOSS 💚</h1>
<input type="text" id="key" placeholder="Key..." />
<button onclick="check()">Unlock</button>
<p id="msg"></p>
<script>
function check(){
  if(document.getElementById('key').value === 'BLACKY999'){
    document.getElementById('msg').textContent = '✅ Unlocked! Predictor working!';
  } else {
    document.getElementById('msg').textContent = '❌ Wrong Key';
  }
}
</script>
</body>
</html>
